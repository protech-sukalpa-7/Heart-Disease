<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heart Disease Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container">
      <h1>Heart Disease Prediction</h1>
      <p>Enter the details below to estimate the likelihood of heart disease.</p>

      <form method="post">
        <div class="grid">
          <label>
            Age
            <input type="number" name="age" min="1" max="120" value="{{ form_data.age if form_data else '' }}" required />
          </label>

          <label>
            Sex
            <select name="sex">
              {% for option in categories.sex %}
              <option value="{{ option }}" {% if form_data and form_data.sex == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            Dataset
            <select name="dataset">
              {% for option in categories.dataset %}
              <option value="{{ option }}" {% if form_data and form_data.dataset == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            Chest Pain Type
            <select name="cp">
              {% for option in categories.cp %}
              <option value="{{ option }}" {% if form_data and form_data.cp == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            Resting Blood Pressure
            <input type="number" name="trestbps" min="80" max="300" value="{{ form_data.trestbps if form_data else '' }}" required />
          </label>

          <label>
            Cholesterol
            <input type="number" name="chol" min="100" max="600" value="{{ form_data.chol if form_data else '' }}" required />
          </label>

          <label>
            FBS
            <select name="fbs">
              {% for option in categories.fbs %}
              <option value="{{ option }}" {% if form_data and form_data.fbs == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            Rest ECG
            <select name="restecg">
              {% for option in categories.restecg %}
              <option value="{{ option }}" {% if form_data and form_data.restecg == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            Max Heart Rate
            <input type="number" name="thalch" min="60" max="220" value="{{ form_data.thalch if form_data else '' }}" required />
          </label>

          <label>
            Exercise Induced Angina
            <select name="exang">
              {% for option in categories.exang %}
              <option value="{{ option }}" {% if form_data and form_data.exang == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            Oldpeak
            <input type="number" step="0.1" name="oldpeak" min="0" max="10" value="{{ form_data.oldpeak if form_data else '' }}" required />
          </label>

          <label>
            Slope
            <select name="slope">
              {% for option in categories.slope %}
              <option value="{{ option }}" {% if form_data and form_data.slope == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>

          <label>
            Major Vessels
            <input type="number" name="ca" min="0" max="4" value="{{ form_data.ca if form_data else '' }}" required />
          </label>

          <label>
            Thalassemia
            <select name="thal">
              {% for option in categories.thal %}
              <option value="{{ option }}" {% if form_data and form_data.thal == option %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </label>
        </div>

        <button type="submit">Predict</button>
      </form>

      {% if prediction_text %}
      <div class="result-card">
        <h2>{{ prediction_text }}</h2>
        {% if probability is not none %}
        <p>Risk Probability: {{ probability }}%</p>
        {% endif %}
      </div>
      {% endif %}
    </div>
  </body>
</html>
